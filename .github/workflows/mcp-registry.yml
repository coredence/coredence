# Publishes a release's server.json to the official MCP Registry
# (registry.modelcontextprotocol.io).
#
# Run by hand after a release: gh workflow run mcp-registry.yml -f version=1.9.2
#
# Authentication is GitHub OIDC: the registry trusts that this job runs in a
# repository owned by the coredence organisation and grants the
# io.github.coredence/* namespace. No token or secret is involved. The
# interactive device login cannot publish under an organisation today
# (modelcontextprotocol/registry#1649).
name: MCP Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v, e.g. 1.9.2
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Fetch server.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release download "v$VERSION" -R "$GITHUB_REPOSITORY" -p server.json

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum -c -
          tar xzf publisher.tar.gz mcp-publisher

      - name: Check the release and server.json agree
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(jq -r .version server.json)" = "$VERSION"

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
